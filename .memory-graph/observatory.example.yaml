# Machine-wide Memory Observatory settings (optional).
# Copy to ~/.memory-graph/observatory.yaml or set OBSERVATORY_ROOTS env var.
#
# roots: directories to scan for repos with .memory-graph/ or memory/state.yaml
# max_depth: how deep to walk under each root (default 4)

roots:
  - ~/Desktop
  - ~/Documents
  - ~/Projects

# max_depth: 4
# port: 8765   # override via OBSERVATORY_PORT when launching
